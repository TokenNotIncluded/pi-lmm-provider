name: Remote control integration
on:
  push:
    branches: [feat/model-independent-remote-control]
    paths: [.remote-control-change.b64]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply the reviewed source update to this feature branch
        if: github.event_name == 'push' && github.ref_name == 'feat/model-independent-remote-control'
        shell: bash
        run: |
          if [ -f .remote-control-change.b64 ]; then
            python3 - <<'PY'
          import base64, pathlib, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('.remote-control-change.b64').read_text().strip(), validate=True))
          subprocess.run(['git', 'apply', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
            git rm .remote-control-change.b64
            git -c user.name='LMM integration' -c user.email='noreply@lmm.best' commit -m 'feat: model-independent encrypted Pi remote control and native UI bridge'
            git push origin HEAD:feat/model-independent-remote-control
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - run: npm run test:pi
      - name: Install the published ask_user extension without lifecycle scripts
        run: npm install --no-save --package-lock=false --ignore-scripts pi-ask-user@0.16.0 @sinclair/typebox@0.34.52
      - name: Actual Pi SDK and third-party ask_user acceptance
        run: npm run test:remote
